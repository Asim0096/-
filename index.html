<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لعبة نونو: أي موقف صحيح؟</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8f6ff;--ink:#37474f;--card:#ffffff;--ok:#43a047;--okbg:#e6f7e8;--bad:#ef5350;--hdr:#1e88e5;--sub:#ef6c00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17303f;--ink:#eceff1;--card:#24435a;--okbg:#1f4a35;--sub:#ffb74d;--hdr:#64b5f6}}
:root[data-theme="dark"]{--bg:#17303f;--ink:#eceff1;--card:#24435a;--okbg:#1f4a35;--sub:#ffb74d;--hdr:#64b5f6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Baloo Bhaijaan 2',Tahoma,Arial,sans-serif;min-height:100vh}
.wrap{max-width:520px;margin:0 auto;padding:10px 12px 30px}
header{display:flex;align-items:center;gap:10px}
#nonu{width:76px;flex:none}#nonu.jump{animation:jump .7s}
@keyframes jump{0%,100%{transform:translateY(0)}30%{transform:translateY(-20px) rotate(-6deg)}60%{transform:translateY(0) rotate(5deg)}80%{transform:translateY(-6px)}}
h1{margin:0;font-size:26px;color:var(--hdr);font-weight:800;line-height:1.15}
.q{margin:2px 0 0;font-size:19px;color:var(--sub);font-weight:800}
.bar{display:flex;align-items:center;justify-content:space-between;margin:8px 0 4px;gap:8px}
#stars{display:flex;gap:4px;font-size:28px}#stars span{filter:grayscale(1) opacity(.35);transition:.3s}#stars span.on{filter:none;transform:scale(1.2)}
.snd{font:inherit;font-size:15px;font-weight:700;border:0;border-radius:20px;padding:6px 12px;background:var(--card);color:var(--ink);box-shadow:0 3px 0 #0002;cursor:pointer}
.qbox{background:#fff3c4;color:#4e342e;border:4px solid #ffc107;border-radius:22px;padding:10px 14px;margin:4px 0 8px;text-align:center;font-size:21px;font-weight:800;line-height:1.4}.qbox:empty{display:none}
.msg{min-height:50px;text-align:center;font-size:19px;font-weight:800;margin:4px 0 8px;line-height:1.35}
.msg.ok{color:var(--ok)}.msg.no{color:var(--bad)}
.opt{display:block;width:100%;font:inherit;color:var(--ink);background:var(--card);border:5px solid #90caf9;border-radius:24px;padding:6px;margin-bottom:12px;cursor:pointer;box-shadow:0 5px 0 #0002;position:relative;transition:opacity .3s,transform .12s}
.opt svg{display:block;width:100%;height:auto;border-radius:16px}
.opt .cap{display:block;font-size:17px;font-weight:700;padding:6px 4px 2px}
.opt:active{transform:scale(.98)}
.opt:focus-visible{outline:4px solid var(--hdr);outline-offset:2px}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.right::after{content:"✅";position:absolute;top:8px;inset-inline-start:10px;font-size:34px}
.opt.wrong{border-color:var(--bad);opacity:.55}
.opt.wrong::after{content:"❌";position:absolute;top:8px;inset-inline-start:10px;font-size:34px}
.opt.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.opt[disabled]{cursor:default}
.next{display:none;margin:0 auto;font:inherit;font-size:22px;font-weight:800;color:#fff;background:#ff7043;border:0;border-radius:30px;padding:10px 30px;box-shadow:0 5px 0 #bf360c;cursor:pointer}
.next.show{display:block}
#win{display:none;text-align:center}#win.show{display:block}#win .big{font-size:30px;font-weight:800;color:var(--ok);margin-bottom:6px}
.conf{position:fixed;top:-20px;font-size:26px;pointer-events:none;animation:fall 1.8s linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.conf{display:none}#nonu.jump,.opt.shake{animation:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
<svg id="nonu" viewBox="0 0 200 200" aria-hidden="true"><ellipse cx="72" cy="48" rx="17" ry="44" fill="#fff" stroke="#b08968" stroke-width="4"/><ellipse cx="72" cy="52" rx="7" ry="28" fill="#ffb3c1"/><ellipse cx="128" cy="48" rx="17" ry="44" fill="#fff" stroke="#b08968" stroke-width="4"/><ellipse cx="128" cy="52" rx="7" ry="28" fill="#ffb3c1"/><circle cx="100" cy="118" r="58" fill="#fff" stroke="#b08968" stroke-width="4"/><circle cx="68" cy="128" r="10" fill="#ffc2d1"/><circle cx="132" cy="128" r="10" fill="#ffc2d1"/><circle cx="82" cy="108" r="6" fill="#37474f"/><circle cx="118" cy="108" r="6" fill="#37474f"/><ellipse cx="100" cy="124" rx="7" ry="5" fill="#ff8fa3"/><path d="M84 134 Q100 152 116 134" fill="none" stroke="#6d4c41" stroke-width="4" stroke-linecap="round"/></svg>
<div><h1>أي موقف صحيح؟</h1><p class="q">اضغط على الصورة الصحيحة</p></div>
</header>
<div class="bar"><div id="stars" aria-label="التقدم"></div><button class="snd" id="snd" type="button">🔊 الصوت</button></div>
<div class="qbox" id="qbox"></div>
<div class="msg" id="msg" role="status" aria-live="polite"></div>
<div id="opts"></div>
<button class="next" id="next" type="button">التالي</button>
<div id="win"><div class="big">أنت بطل المواقف الصحيحة! 🏆</div><div>نونو فخور بك. نستخدم كلامنا ونكون لطفاء.</div><button class="next show" id="again" type="button" style="margin-top:12px">العب مرة ثانية</button></div>
</div>
<script>
/* ---------- cartoon kids ---------- */
const SK=['#ffd9b3','#e0ac69','#a8693a'];
function kid(x,y,o){o=Object.assign({sk:SK[0],hr:'#4e342e',sh:'#42a5f5',hair:'boy',mood:'happy',aL:[-26,40],aR:[26,40],s:1,pt:'#455a64'},o);
 const arm=(sx,e)=>`<line x1="${sx}" y1="32" x2="${e[0]}" y2="${e[1]}" stroke="${o.sk}" stroke-width="10" stroke-linecap="round"/><circle cx="${e[0]}" cy="${e[1]}" r="6.5" fill="${o.sk}"/>`;
 const mouth={happy:'<path d="M-9 10 Q0 21 9 10" fill="none" stroke="#6d4c41" stroke-width="3" stroke-linecap="round"/>',
  sad:'<path d="M-8 17 Q0 8 8 17" fill="none" stroke="#6d4c41" stroke-width="3" stroke-linecap="round"/>',
  mad:'<path d="M-8 15 L8 15" stroke="#6d4c41" stroke-width="3.5" stroke-linecap="round"/>',
  laugh:'<path d="M-11 8 Q0 28 11 8Z" fill="#b71c1c" stroke="#6d4c41" stroke-width="2.5" stroke-linejoin="round"/>'}[o.mood];
 const brows={mad:'<path d="M-15 -12 L-4 -7 M15 -12 L4 -7" stroke="#3e2723" stroke-width="3.5" stroke-linecap="round"/>',sad:'<path d="M-15 -8 L-4 -12 M15 -8 L4 -12" stroke="#3e2723" stroke-width="3" stroke-linecap="round"/>'}[o.mood]||'';
 const tear=o.mood==='sad'?'<path d="M-13 6 q-5 10 0 13 q5 -3 0 -13z" fill="#4fc3f7"/>':'';
 const hair=`<path d="M-26 -1 Q-27 -32 0 -32 Q27 -32 26 -1 Q13 -15 0 -15 Q-13 -15 -26 -1Z" fill="${o.hr}"/>`+(o.hair==='girl'?`<circle cx="-29" cy="4" r="9" fill="${o.hr}"/><circle cx="29" cy="4" r="9" fill="${o.hr}"/>`:'');
 return `<g transform="translate(${x} ${y}) scale(${o.s})"><rect x="-13" y="60" width="11" height="32" rx="5" fill="${o.pt}"/><rect x="2" y="60" width="11" height="32" rx="5" fill="${o.pt}"/><ellipse cx="-8" cy="94" rx="11" ry="5" fill="#37474f"/><ellipse cx="8" cy="94" rx="11" ry="5" fill="#37474f"/>
 <rect x="-18" y="24" width="36" height="44" rx="15" fill="${o.sh}"/>${arm(-17,o.aL)}${arm(17,o.aR)}
 <circle cx="0" cy="0" r="26" fill="${o.sk}"/>${hair}<circle cx="-9" cy="-1" r="3.2" fill="#263238"/><circle cx="9" cy="-1" r="3.2" fill="#263238"/>${brows}${mouth}${tear}</g>`;}
function bub(x,y,w,t,c='#ef5350'){return `<g><rect x="${x}" y="${y}" width="${w}" height="30" rx="15" fill="#fff" stroke="${c}" stroke-width="3"/><text x="${x+w/2}" y="${y+21}" font-size="17" font-weight="800" fill="${c}" text-anchor="middle" font-family="Baloo Bhaijaan 2,Tahoma,Arial">${t}</text></g>`}
const em=(x,y,t,s=30)=>`<text x="${x}" y="${y}" font-size="${s}" text-anchor="middle">${t}</text>`;
const scene=(inner,bg='#d6f0ff')=>`<svg viewBox="0 0 300 200" role="img"><rect width="300" height="200" fill="${bg}"/><circle cx="268" cy="30" r="16" fill="#ffee58"/><rect y="150" width="300" height="50" fill="#a5d6a7"/>${inner}</svg>`;
const ball=(x,y)=>`<circle cx="${x}" cy="${y}" r="13" fill="#ff7043" stroke="#fff" stroke-width="2.5"/><path d="M${x-13} ${y} Q${x} ${y-8} ${x+13} ${y}" fill="none" stroke="#fff" stroke-width="2"/>`;
const paper=(x,y,good)=>`<rect x="${x}" y="${y}" width="40" height="32" rx="3" fill="#fff" stroke="#90a4ae" stroke-width="2"/>${good?`<circle cx="${x+14}" cy="${y+14}" r="7" fill="#ffca28"/><path d="M${x+6} ${y+27} L${x+20} ${y+17} L${x+34} ${y+27}Z" fill="#66bb6a"/>`:`<path d="M${x+7} ${y+8} l8 14 l6 -12 l8 14 l6 -10" fill="none" stroke="#e57373" stroke-width="2.5"/>`}`;
/* ---------- rounds ---------- */
const R=[
 {q:'حصل شجار بين طفلين، كيف يتصرفان؟',why:'نستخدم كلامنا لا أيدينا: نقول «توقف».',bad:'الضرب يؤذي ولا يحل المشكلة.',
  good:{c:'طفل يقول «توقف! هذا يزعجني»',svg:scene(kid(95,66,{mood:'happy',aR:[28,-30],sh:'#ab47bc'})+kid(215,66,{mood:'mad',hr:'#212121',sk:SK[1],sh:'#ffa726',hair:'boy'})+bub(40,6,110,'توقف!','#43a047')+em(140,66,'✋',34))},
  bad:{c:'طفل يضرب زميله',svg:scene(kid(95,66,{mood:'mad',aR:[50,12],sh:'#ef5350'})+kid(215,66,{mood:'sad',sk:SK[1],hr:'#212121',sh:'#26a69a'})+em(165,50,'💥',34))}},
 {q:'انتهت الطفلة من رسمتها وأرتها لأصدقائها، كيف تصرفت صديقتها؟',why:'نشجع الآخرين بكلمات طيبة.',bad:'الضحك على الآخرين يجرحهم.',
  good:{c:'طفلة تمدح رسمة صديقتها',svg:scene(kid(80,66,{mood:'happy',hair:'girl',hr:'#a1522a',sh:'#ec407a',aR:[50,40]})+paper(110,36,true)+kid(220,66,{mood:'happy',sk:SK[2],hr:'#212121',sh:'#42a5f5',aR:[-10,-10]})+em(150,24,'⭐',26)+bub(168,6,110,'رسمة جميلة!','#43a047'))},
  bad:{c:'طفلة تضحك على رسمة صديقتها',svg:scene(kid(80,66,{mood:'sad',hair:'girl',hr:'#a1522a',sh:'#ec407a',aR:[48,38]})+paper(106,34,false)+kid(225,66,{mood:'laugh',sk:SK[1],hr:'#212121',sh:'#ffa726',aL:[-56,12]})+em(150,18,'😂',24))}},
 {q:'طفلان يلعبان بالكرة، كيف يتصرفان؟',why:'نتشارك الألعاب ونتناوب عليها.',bad:'أخذ اللعبة بالقوة يزعج الآخرين.',
  good:{c:'طفلان يتشاركان اللعبة',svg:scene(kid(95,66,{mood:'happy',sh:'#66bb6a',aR:[38,50]})+kid(205,66,{mood:'happy',hair:'girl',sk:SK[2],hr:'#212121',sh:'#ffa726',aL:[-38,50]})+ball(150,112)+em(150,40,'💖',28))},
  bad:{c:'طفل يأخذ اللعبة بالقوة',svg:scene(kid(95,66,{mood:'mad',sh:'#ef5350',aR:[40,48]})+kid(205,66,{mood:'sad',hair:'girl',sk:SK[2],hr:'#212121',sh:'#ffa726',aL:[-30,48]})+ball(138,110)+em(150,40,'💢',28))}},
 {q:'تعرض طفل لموقف سيئ وأصبح يبكي، ماذا يفعل؟',why:'نخبر الكبار الذين نثق بهم.',bad:'السكوت والبكاء وحدنا لا يوقف الأذى.',
  good:{c:'طفل يخبر معلمته',svg:scene(kid(75,66,{mood:'happy',aR:[26,-34],sh:'#42a5f5'})+bub(18,6,115,'يا معلمتي!','#43a047')+kid(215,56,{s:1.2,mood:'happy',hair:'girl',sk:SK[1],hr:'#4e342e',sh:'#7e57c2',pt:'#5e35b1'})+em(250,150,'📚',24))},
  bad:{c:'طفل يبكي ولا يخبر أحدًا',svg:scene(kid(150,66,{mood:'sad',sh:'#42a5f5',aL:[-18,10],aR:[18,10]})+em(100,60,'😢',24)+bub(190,20,80,'...','#90a4ae'))}},
 {q:'مجموعة أطفال يلعبون، وهناك طفل يريد أن يلعب معهم، ماذا يقول له الأطفال؟',why:'نقول كلمات طيبة وندعو الآخرين للعب.',bad:'الكلمات الجارحة تحزن الآخرين.',
  good:{c:'طفل يقول: «تعال العب معنا!»',svg:scene(kid(95,66,{mood:'happy',aR:[40,0],sh:'#66bb6a'})+bub(30,6,140,'تعال العب معنا!','#43a047')+kid(215,66,{mood:'happy',sk:SK[1],hr:'#212121',sh:'#ffa726'})+ball(150,118))},
  bad:{c:'طفل يقول: «أنت سيئ!»',svg:scene(kid(95,66,{mood:'mad',aR:[44,6],sh:'#ef5350'})+bub(40,6,110,'أنت سيئ!')+kid(215,66,{mood:'sad',sk:SK[1],hr:'#212121',sh:'#26a69a'}))}}
];
/* ---------- sound ---------- */
let soundOn=true,ctx=null;try{soundOn=localStorage.getItem('nonu-snd2')!=='off'}catch(e){}
function audio(){if(!ctx){try{ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ctx&&ctx.state==='suspended')ctx.resume();return ctx}
function tone(f,t,d,type='triangle',v=.22){const c=audio();if(!c||!soundOn)return;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,c.currentTime+t);g.gain.linearRampToValueAtTime(v,c.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+d);o.connect(g);g.connect(c.destination);o.start(c.currentTime+t);o.stop(c.currentTime+t+d+.05)}
const happy=()=>{[523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>tone(f,i*.09,.35));tone(2093,.45,.3,'sine',.1)};
const oops=()=>{tone(300,0,.18,'sine',.2);tone(220,.16,.3,'sine',.2)};
const fanfare=()=>{[523.25,523.25,659.25,783.99,659.25,783.99,1046.5].forEach((f,i)=>tone(f,i*.15,.3));[1046.5,1318.5,1568].forEach((f,i)=>tone(f,1.15+i*.12,.5,'sine',.18))};
/* ---------- game ---------- */
const $=id=>document.getElementById(id);let order=[],idx=0,done=false;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function conf(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const e=['🎉','⭐','🎈','💖','✨','🌟'];for(let i=0;i<26;i++){const s=document.createElement('span');s.className='conf';s.textContent=e[i%e.length];s.style.left=Math.random()*100+'vw';s.style.animationDelay=Math.random()*.5+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),2600)}}
function jump(){const n=$('nonu');n.classList.remove('jump');void n.getBoundingClientRect();n.classList.add('jump')}
function msg(t,c=''){const m=$('msg');m.textContent=t;m.className='msg '+c}
function start(){order=shuffle(R.map((_,i)=>i));idx=0;$('win').classList.remove('show');$('opts').style.display='';$('stars').innerHTML=R.map(()=>'<span>⭐</span>').join('');show()}
function show(){done=false;$('next').classList.remove('show');const r=R[order[idx]];$('qbox').textContent=r.q;msg('اختر الصورة الصحيحة 👇');
 const items=shuffle([{k:'good',d:r.good},{k:'bad',d:r.bad}]);$('opts').innerHTML='';
 items.forEach(it=>{const b=document.createElement('button');b.type='button';b.className='opt';b.innerHTML=it.d.svg+`<span class="cap">${it.d.c}</span>`;b.onclick=()=>choose(b,it.k,r);$('opts').appendChild(b)})}
function choose(b,k,r){if(done||b.classList.contains('wrong'))return;audio();
 if(k==='good'){done=true;b.classList.add('right');[...$('opts').children].forEach(x=>{if(x!==b)x.disabled=true});$('stars').children[idx].classList.add('on');happy();jump();conf();msg('صح! أحسنت 🌟 '+r.why,'ok');
  if(idx===R.length-1){setTimeout(()=>{$('opts').style.display='none';$('qbox').textContent='';$('next').classList.remove('show');$('win').classList.add('show');msg('🎉 أنت رائع! 🎉','ok');fanfare();conf();jump()},2400)}
  else{$('next').classList.add('show');$('next').textContent='التالي'}}
 else{b.classList.add('wrong','shake');oops();msg('ليس هذا الموقف. '+r.bad+' جرّب الصورة الثانية.','no');setTimeout(()=>b.classList.remove('shake'),450)}}
$('next').onclick=()=>{audio();idx++;show()};$('again').onclick=()=>{audio();start()};
function paint(){$('snd').textContent=soundOn?'🔊 الصوت':'🔇 الصوت'}
$('snd').onclick=()=>{soundOn=!soundOn;try{localStorage.setItem('nonu-snd2',soundOn?'on':'off')}catch(e){}paint();if(soundOn){audio();tone(700,0,.08,'sine',.12)}};
paint();start();
</script>
</body>
</html>
